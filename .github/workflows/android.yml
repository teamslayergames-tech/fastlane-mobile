name: Build FastLane APK

# Builds the FastLane Android app and publishes it as a GitHub release.
# Players download it from: https://github.com/teamslayergames-tech/fastlane-mobile/releases/latest/download/FastLane.apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      # The Android Java runtimes come from PojavLauncher's builds. If those have expired,
      # fall back to taking them out of the latest 2009Scape Mobile release.
      - name: Get JRE 8
        id: jre8
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre8
          name: jre8-pojav
      - name: Get JRE 17
        id: jre17
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          path: app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: success
          repo: PojavLauncherTeam/android-openjdk-build-multiarch
          branch: buildjre17
          name: jre17-pojav
      - name: Fallback - runtimes from the 2009Scape Mobile release
        if: steps.jre8.outcome != 'success' || steps.jre17.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo 2009scape/2009Scape-mobile --pattern '*.apk' --dir /tmp/upstream
          APK=$(ls /tmp/upstream/*.apk | head -1); echo "Using $APK"
          mkdir -p /tmp/up && unzip -q "$APK" 'assets/components/jre/*' 'assets/components/jre-new/*' -d /tmp/up || true
          for d in jre jre-new; do
            if [ -d /tmp/up/assets/components/$d ]; then rm -rf app_pojavlauncher/src/main/assets/components/$d; cp -r /tmp/up/assets/components/$d app_pojavlauncher/src/main/assets/components/$d; fi
          done
          ls app_pojavlauncher/src/main/assets/components/

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.1

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh
          mkdir out
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build the APK
        run: |
          gradle :app_pojavlauncher:assembleDebug
          mv app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk out/FastLane.apk
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FastLane Mobile (build ${{ github.run_number }})
          body: |
            Install FastLane.apk on your Android phone (allow "install unknown apps" for your browser if asked).
            Direct link: https://github.com/teamslayergames-tech/fastlane-mobile/releases/latest/download/FastLane.apk
          files: out/FastLane.apk
          make_latest: true
